# 一份配置同时拉起服务与存储：
# 存储为内嵌 SQLite（WAL 模式），数据落在命名卷 flash-data 上，随服务一起启动。
services:
  flash-api:
    build: .
    image: binary-flash-service:latest
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件位置（容器内路径，挂载到命名卷持久化）
      FLASH_DB_PATH: /data/flash.db
      # 可选调参（默认值见 app/config.py）：
      # FLASH_FEED_SUM_TOLERANCE: "1e-6"
      # FLASH_RR_FUNCTION_TOLERANCE: "1e-12"
      # FLASH_RR_BRACKET_TOLERANCE: "1e-14"
      # FLASH_RR_MAX_ITERATIONS: "200"
      # FLASH_NONIDEAL_K_TOLERANCE: "1e-10"
      # FLASH_NONIDEAL_LN_K_STEP: "1.0"
      # FLASH_NONIDEAL_MAX_ITERATIONS: "200"
    volumes:
      - flash-data:/data
    restart: unless-stopped

volumes:
  flash-data:
